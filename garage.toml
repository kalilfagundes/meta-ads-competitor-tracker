# Configuration of the bundled Garage (https://garagehq.deuxfleurs.fr), the media storage
# started by docker compose's "garage" profile. A single node, reachable only by the other
# containers. Its secrets aren't here: compose passes GARAGE_RPC_SECRET and
# GARAGE_ADMIN_TOKEN from .env. The garage-init service creates the key and bucket.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite is slower than the default LMDB but survives an unclean shutdown.
db_engine = "sqlite"

replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
